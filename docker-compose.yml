services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edgelab}
      POSTGRES_USER: ${POSTGRES_USER:-edgelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgelab}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-edgelab} -d ${POSTGRES_DB:-edgelab}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:${EDGELAB_POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgbouncer-postgres:
    build:
      context: .
      dockerfile: docker/pgbouncer/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edgelab}
      POSTGRES_USER: ${POSTGRES_USER:-edgelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgelab}
      EDGELAB_PGBOUNCER_DATABASE: ${POSTGRES_DB:-edgelab}
      EDGELAB_PGBOUNCER_TARGET_DB: ${POSTGRES_DB:-edgelab}
      EDGELAB_PGBOUNCER_TARGET_HOST: postgres
      EDGELAB_PGBOUNCER_TARGET_PORT: 5432
      EDGELAB_PGBOUNCER_LISTEN_PORT: 6432
      EDGELAB_PGBOUNCER_MAX_CLIENT_CONN: ${EDGELAB_PGBOUNCER_MAX_CLIENT_CONN:-400}
      EDGELAB_PGBOUNCER_DEFAULT_POOL_SIZE: ${EDGELAB_PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      EDGELAB_PGBOUNCER_RESERVE_POOL_SIZE: ${EDGELAB_PGBOUNCER_RESERVE_POOL_SIZE:-5}
      EDGELAB_PGBOUNCER_SERVER_IDLE_TIMEOUT_SECONDS: ${EDGELAB_PGBOUNCER_SERVER_IDLE_TIMEOUT_SECONDS:-600}
      EDGELAB_PGBOUNCER_SERVER_CONNECT_TIMEOUT_SECONDS: ${EDGELAB_PGBOUNCER_SERVER_CONNECT_TIMEOUT_SECONDS:-15}
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD=${POSTGRES_PASSWORD:-edgelab} psql "host=127.0.0.1 port=6432 user=${POSTGRES_USER:-edgelab} dbname=${POSTGRES_DB:-edgelab}" -c "SHOW VERSION;" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${EDGELAB_PGBOUNCER_POSTGRES_PORT:-6432}:6432"
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:2.16.1-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edgelab}
      POSTGRES_USER: ${POSTGRES_USER:-edgelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgelab}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-edgelab} -d ${POSTGRES_DB:-edgelab}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:${EDGELAB_TIMESCALE_PORT:-5433}:5432"
    restart: unless-stopped
    volumes:
      - timescaledb-data:/var/lib/postgresql/data

  pgbouncer-timescaledb:
    build:
      context: .
      dockerfile: docker/pgbouncer/Dockerfile
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edgelab}
      POSTGRES_USER: ${POSTGRES_USER:-edgelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgelab}
      EDGELAB_PGBOUNCER_DATABASE: ${POSTGRES_DB:-edgelab}
      EDGELAB_PGBOUNCER_TARGET_DB: ${POSTGRES_DB:-edgelab}
      EDGELAB_PGBOUNCER_TARGET_HOST: timescaledb
      EDGELAB_PGBOUNCER_TARGET_PORT: 5432
      EDGELAB_PGBOUNCER_LISTEN_PORT: 6432
      EDGELAB_PGBOUNCER_MAX_CLIENT_CONN: ${EDGELAB_PGBOUNCER_MAX_CLIENT_CONN:-400}
      EDGELAB_PGBOUNCER_DEFAULT_POOL_SIZE: ${EDGELAB_PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      EDGELAB_PGBOUNCER_RESERVE_POOL_SIZE: ${EDGELAB_PGBOUNCER_RESERVE_POOL_SIZE:-5}
      EDGELAB_PGBOUNCER_SERVER_IDLE_TIMEOUT_SECONDS: ${EDGELAB_PGBOUNCER_SERVER_IDLE_TIMEOUT_SECONDS:-600}
      EDGELAB_PGBOUNCER_SERVER_CONNECT_TIMEOUT_SECONDS: ${EDGELAB_PGBOUNCER_SERVER_CONNECT_TIMEOUT_SECONDS:-15}
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD=${POSTGRES_PASSWORD:-edgelab} psql "host=127.0.0.1 port=6432 user=${POSTGRES_USER:-edgelab} dbname=${POSTGRES_DB:-edgelab}" -c "SHOW VERSION;" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${EDGELAB_PGBOUNCER_TIMESCALE_PORT:-6433}:6432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:${EDGELAB_REDIS_PORT:-6379}:6379"
    restart: unless-stopped

  minio:
    profiles:
      - benchmark
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edgelabminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-edgelabminio}
    ports:
      - "127.0.0.1:${EDGELAB_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${EDGELAB_MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      pgbouncer-postgres:
        condition: service_healthy
      pgbouncer-timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      EDGELAB_POSTGRES_HOST: ${EDGELAB_POSTGRES_HOST:-pgbouncer-postgres}
      EDGELAB_POSTGRES_CONNECT_PORT: ${EDGELAB_POSTGRES_CONNECT_PORT:-6432}
      EDGELAB_API_TOKEN: ${EDGELAB_API_TOKEN:-}
      EDGELAB_API_WORKERS: ${EDGELAB_API_WORKERS:-}
      EDGELAB_API_TIMEOUT_SECONDS: ${EDGELAB_API_TIMEOUT_SECONDS:-120}
      EDGELAB_API_GRACEFUL_TIMEOUT_SECONDS: ${EDGELAB_API_GRACEFUL_TIMEOUT_SECONDS:-30}
      EDGELAB_API_KEEPALIVE_SECONDS: ${EDGELAB_API_KEEPALIVE_SECONDS:-5}
      EDGELAB_JWT_SECRET: ${EDGELAB_JWT_SECRET:-}
      EDGELAB_BETA_MANUAL_ACCESS_ENABLED: ${EDGELAB_BETA_MANUAL_ACCESS_ENABLED:-0}
      EDGELAB_BETA_SEATS_TOTAL: ${EDGELAB_BETA_SEATS_TOTAL:-500}
      EDGELAB_CACHE_MARKET_DATA: ${EDGELAB_CACHE_MARKET_DATA:-1}
      EDGELAB_MARKET_DATA_IMPORT_ENABLED: ${EDGELAB_MARKET_DATA_IMPORT_ENABLED:-1}
      EDGELAB_MARKET_DATA_DATABASE_URL: ${EDGELAB_MARKET_DATA_DATABASE_URL:-postgresql+psycopg://edgelab:edgelab@pgbouncer-timescaledb:6432/edgelab}
      EDGELAB_REDIS_URL: ${EDGELAB_REDIS_URL:-redis://redis:6379/0}
      EDGELAB_RATE_LIMIT_WINDOW_SECONDS: ${EDGELAB_RATE_LIMIT_WINDOW_SECONDS:-60}
      EDGELAB_DATASET_REFRESH_RATE_LIMIT: ${EDGELAB_DATASET_REFRESH_RATE_LIMIT:-6}
      EDGELAB_MARKET_DATA_META_RATE_LIMIT: ${EDGELAB_MARKET_DATA_META_RATE_LIMIT:-240}
      EDGELAB_MARKET_DATA_BARS_RATE_LIMIT: ${EDGELAB_MARKET_DATA_BARS_RATE_LIMIT:-240}
      EDGELAB_DATASET_AUTO_DISCOVERY_ENABLED: ${EDGELAB_DATASET_AUTO_DISCOVERY_ENABLED:-0}
      EDGELAB_DATASETS_ROOT: /datasets
      EDGELAB_PUBLIC_ORIGIN: ${EDGELAB_PUBLIC_ORIGIN:-}
      EDGELAB_MAX_APP_DATA_ROWS: ${EDGELAB_MAX_APP_DATA_ROWS:-100000}
      EDGELAB_MAX_REQUEST_BODY_BYTES: ${EDGELAB_MAX_REQUEST_BODY_BYTES:-26214400}
      GOOGLE_CLIENT_SECRETS_FILE: ${GOOGLE_CLIENT_SECRETS_FILE:-/opt/edgelab/deployment/google-oauth-client.json}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    volumes:
      - api-data:/var/lib/edgelab
      - type: bind
        source: ${EDGELAB_DATASETS_ROOT:-./datasets}
        target: /datasets
        read_only: true
      - type: bind
        source: ./deployment
        target: /opt/edgelab/deployment
        read_only: true

  market-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      pgbouncer-postgres:
        condition: service_healthy
      pgbouncer-timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      EDGELAB_POSTGRES_HOST: ${EDGELAB_POSTGRES_HOST:-pgbouncer-postgres}
      EDGELAB_POSTGRES_CONNECT_PORT: ${EDGELAB_POSTGRES_CONNECT_PORT:-6432}
      EDGELAB_API_TOKEN: ${EDGELAB_API_TOKEN:-}
      EDGELAB_API_WORKERS: ${EDGELAB_API_WORKERS:-}
      EDGELAB_API_TIMEOUT_SECONDS: ${EDGELAB_API_TIMEOUT_SECONDS:-120}
      EDGELAB_API_GRACEFUL_TIMEOUT_SECONDS: ${EDGELAB_API_GRACEFUL_TIMEOUT_SECONDS:-30}
      EDGELAB_API_KEEPALIVE_SECONDS: ${EDGELAB_API_KEEPALIVE_SECONDS:-5}
      EDGELAB_JWT_SECRET: ${EDGELAB_JWT_SECRET:-}
      EDGELAB_BETA_MANUAL_ACCESS_ENABLED: ${EDGELAB_BETA_MANUAL_ACCESS_ENABLED:-0}
      EDGELAB_BETA_SEATS_TOTAL: ${EDGELAB_BETA_SEATS_TOTAL:-500}
      EDGELAB_CACHE_MARKET_DATA: ${EDGELAB_CACHE_MARKET_DATA:-1}
      EDGELAB_MARKET_DATA_IMPORT_ENABLED: ${EDGELAB_MARKET_DATA_IMPORT_ENABLED:-1}
      EDGELAB_MARKET_DATA_DATABASE_URL: ${EDGELAB_MARKET_DATA_DATABASE_URL:-postgresql+psycopg://edgelab:edgelab@pgbouncer-timescaledb:6432/edgelab}
      EDGELAB_REDIS_URL: ${EDGELAB_REDIS_URL:-redis://redis:6379/0}
      EDGELAB_RATE_LIMIT_WINDOW_SECONDS: ${EDGELAB_RATE_LIMIT_WINDOW_SECONDS:-60}
      EDGELAB_DATASET_REFRESH_RATE_LIMIT: ${EDGELAB_DATASET_REFRESH_RATE_LIMIT:-6}
      EDGELAB_MARKET_DATA_META_RATE_LIMIT: ${EDGELAB_MARKET_DATA_META_RATE_LIMIT:-240}
      EDGELAB_MARKET_DATA_BARS_RATE_LIMIT: ${EDGELAB_MARKET_DATA_BARS_RATE_LIMIT:-240}
      EDGELAB_DATASET_AUTO_DISCOVERY_ENABLED: ${EDGELAB_DATASET_AUTO_DISCOVERY_ENABLED:-0}
      EDGELAB_DATASETS_ROOT: /datasets
      EDGELAB_PUBLIC_ORIGIN: ${EDGELAB_PUBLIC_ORIGIN:-}
      EDGELAB_MAX_APP_DATA_ROWS: ${EDGELAB_MAX_APP_DATA_ROWS:-100000}
      EDGELAB_MAX_REQUEST_BODY_BYTES: ${EDGELAB_MAX_REQUEST_BODY_BYTES:-26214400}
      GOOGLE_CLIENT_SECRETS_FILE: ${GOOGLE_CLIENT_SECRETS_FILE:-/opt/edgelab/deployment/google-oauth-client.json}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    volumes:
      - api-data:/var/lib/edgelab
      - type: bind
        source: ${EDGELAB_DATASETS_ROOT:-./datasets}
        target: /datasets
        read_only: true
      - type: bind
        source: ./deployment
        target: /opt/edgelab/deployment
        read_only: true

  data-populator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.data_populator"]
    depends_on:
      pgbouncer-postgres:
        condition: service_healthy
      pgbouncer-timescaledb:
        condition: service_healthy
    user: "${EDGELAB_DATA_POPULATOR_USER:-0:0}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edgelab}
      POSTGRES_USER: ${POSTGRES_USER:-edgelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgelab}
      EDGELAB_POSTGRES_HOST: ${EDGELAB_POSTGRES_HOST:-pgbouncer-postgres}
      EDGELAB_POSTGRES_CONNECT_PORT: ${EDGELAB_POSTGRES_CONNECT_PORT:-6432}
      EDGELAB_DATASETS_ROOT: /datasets
      EDGELAB_MARKET_DATA_IMPORT_ENABLED: ${EDGELAB_MARKET_DATA_IMPORT_ENABLED:-1}
      EDGELAB_MARKET_DATA_DATABASE_URL: ${EDGELAB_MARKET_DATA_DATABASE_URL:-postgresql+psycopg://edgelab:edgelab@pgbouncer-timescaledb:6432/edgelab}
      EDGELAB_DATA_POPULATOR_CRYPTO_SYMBOLS: ${EDGELAB_DATA_POPULATOR_CRYPTO_SYMBOLS:-BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT}
      EDGELAB_DATA_POPULATOR_CRYPTO_START_DATE: ${EDGELAB_DATA_POPULATOR_CRYPTO_START_DATE:-2017-08-17}
      EDGELAB_DATA_POPULATOR_BACKFILL_MODE: ${EDGELAB_DATA_POPULATOR_BACKFILL_MODE:-max}
      EDGELAB_DATA_POPULATOR_DERIVED_TIMEFRAMES: ${EDGELAB_DATA_POPULATOR_DERIVED_TIMEFRAMES:-M5,M15,M30,H1,H4,Daily}
      EDGELAB_DATA_POPULATOR_FOREX_SYMBOLS: ${EDGELAB_DATA_POPULATOR_FOREX_SYMBOLS:-EUR/USD,GBP/USD,USD/JPY,USD/CHF,AUD/USD,USD/CAD,NZD/USD}
      EDGELAB_DATA_POPULATOR_FOREX_START_DATE: ${EDGELAB_DATA_POPULATOR_FOREX_START_DATE:-2003-01-01}
      EDGELAB_DATA_POPULATOR_INTERVAL_SECONDS: ${EDGELAB_DATA_POPULATOR_INTERVAL_SECONDS:-3600}
      EDGELAB_DATA_POPULATOR_LOOKBACK_DAYS: ${EDGELAB_DATA_POPULATOR_LOOKBACK_DAYS:-30}
      EDGELAB_DATA_POPULATOR_REQUEST_TIMEOUT_SECONDS: ${EDGELAB_DATA_POPULATOR_REQUEST_TIMEOUT_SECONDS:-20}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${EDGELAB_DATASETS_ROOT:-./datasets}
        target: /datasets

  analytics-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.analytics_worker"]
    depends_on:
      pgbouncer-postgres:
        condition: service_healthy
    environment:
      EDGELAB_POSTGRES_HOST: ${EDGELAB_POSTGRES_HOST:-pgbouncer-postgres}
      EDGELAB_POSTGRES_CONNECT_PORT: ${EDGELAB_POSTGRES_CONNECT_PORT:-6432}
      EDGELAB_ANALYTICS_INTERVAL_SECONDS: ${EDGELAB_ANALYTICS_INTERVAL_SECONDS:-60}
      EDGELAB_JWT_SECRET: ${EDGELAB_JWT_SECRET:-}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_API_BEARER_TOKEN: ${VITE_API_BEARER_TOKEN:-}
        VITE_DEPLOYMENT_MODE: ${VITE_DEPLOYMENT_MODE:-beta}
        VITE_BETA_SEATS_TOTAL: ${VITE_BETA_SEATS_TOTAL:-500}
        VITE_BETA_SEATS_TAKEN: ${VITE_BETA_SEATS_TAKEN:-0}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    depends_on:
      api:
        condition: service_healthy
      market-api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

  legacy-api:
    profiles:
      - legacy-node-api
    build:
      context: .
      dockerfile: backend/Dockerfile.node
    environment:
      PORT: 3001
      LEGACY_API_MAX_BODY_BYTES: ${LEGACY_API_MAX_BODY_BYTES:-10485760}
      LEGACY_CORS_ORIGINS: ${LEGACY_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - "${LEGACY_API_PORT:-3001}:3001"
    restart: unless-stopped
    volumes:
      - legacy-api-data:/app/backend/data
      - legacy-uploads:/app/backend/uploads

  benchmark-k6:
    profiles:
      - benchmark
    image: grafana/k6:0.49.0
    depends_on:
      frontend:
        condition: service_started
    entrypoint: ["k6"]
    working_dir: /benchmark
    volumes:
      - ./benchmark:/benchmark:ro

volumes:
  api-data:
  postgres-data:
  timescaledb-data:
  minio-data:
  legacy-api-data:
  legacy-uploads:
