x-backend-image: &backend-image
  image: ${EDGELAB_BACKEND_IMAGE:-edgelab-backend:local}
  build:
    context: .
    dockerfile: backend/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edgelab}
      POSTGRES_USER: ${POSTGRES_USER:-edgelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgelab}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-edgelab} -d ${POSTGRES_DB:-edgelab}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:${EDGELAB_POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./docker/observability/postgres/init-observability.sql
        target: /docker-entrypoint-initdb.d/10-observability.sql
        read_only: true

  pgbouncer-postgres:
    build:
      context: .
      dockerfile: docker/pgbouncer/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edgelab}
      POSTGRES_USER: ${POSTGRES_USER:-edgelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgelab}
      EDGELAB_PGBOUNCER_DATABASE: ${POSTGRES_DB:-edgelab}
      EDGELAB_PGBOUNCER_TARGET_DB: ${POSTGRES_DB:-edgelab}
      EDGELAB_PGBOUNCER_TARGET_HOST: postgres
      EDGELAB_PGBOUNCER_TARGET_PORT: 5432
      EDGELAB_PGBOUNCER_LISTEN_PORT: 6432
      EDGELAB_PGBOUNCER_MAX_CLIENT_CONN: ${EDGELAB_PGBOUNCER_MAX_CLIENT_CONN:-400}
      EDGELAB_PGBOUNCER_DEFAULT_POOL_SIZE: ${EDGELAB_PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      EDGELAB_PGBOUNCER_RESERVE_POOL_SIZE: ${EDGELAB_PGBOUNCER_RESERVE_POOL_SIZE:-5}
      EDGELAB_PGBOUNCER_SERVER_IDLE_TIMEOUT_SECONDS: ${EDGELAB_PGBOUNCER_SERVER_IDLE_TIMEOUT_SECONDS:-600}
      EDGELAB_PGBOUNCER_SERVER_CONNECT_TIMEOUT_SECONDS: ${EDGELAB_PGBOUNCER_SERVER_CONNECT_TIMEOUT_SECONDS:-15}
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD=${POSTGRES_PASSWORD:-edgelab} psql "host=127.0.0.1 port=6432 user=${POSTGRES_USER:-edgelab} dbname=${POSTGRES_DB:-edgelab}" -c "SELECT 1;" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${EDGELAB_PGBOUNCER_POSTGRES_PORT:-6432}:6432"
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:2.16.1-pg16
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edgelab}
      POSTGRES_USER: ${POSTGRES_USER:-edgelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgelab}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-edgelab} -d ${POSTGRES_DB:-edgelab}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:${EDGELAB_TIMESCALE_PORT:-5433}:5432"
    restart: unless-stopped
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - type: bind
        source: ./docker/observability/postgres/init-observability.sql
        target: /docker-entrypoint-initdb.d/10-observability.sql
        read_only: true

  pgbouncer-timescaledb:
    build:
      context: .
      dockerfile: docker/pgbouncer/Dockerfile
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edgelab}
      POSTGRES_USER: ${POSTGRES_USER:-edgelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgelab}
      EDGELAB_PGBOUNCER_DATABASE: ${POSTGRES_DB:-edgelab}
      EDGELAB_PGBOUNCER_TARGET_DB: ${POSTGRES_DB:-edgelab}
      EDGELAB_PGBOUNCER_TARGET_HOST: timescaledb
      EDGELAB_PGBOUNCER_TARGET_PORT: 5432
      EDGELAB_PGBOUNCER_LISTEN_PORT: 6432
      EDGELAB_PGBOUNCER_MAX_CLIENT_CONN: ${EDGELAB_PGBOUNCER_MAX_CLIENT_CONN:-400}
      EDGELAB_PGBOUNCER_DEFAULT_POOL_SIZE: ${EDGELAB_PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      EDGELAB_PGBOUNCER_RESERVE_POOL_SIZE: ${EDGELAB_PGBOUNCER_RESERVE_POOL_SIZE:-5}
      EDGELAB_PGBOUNCER_SERVER_IDLE_TIMEOUT_SECONDS: ${EDGELAB_PGBOUNCER_SERVER_IDLE_TIMEOUT_SECONDS:-600}
      EDGELAB_PGBOUNCER_SERVER_CONNECT_TIMEOUT_SECONDS: ${EDGELAB_PGBOUNCER_SERVER_CONNECT_TIMEOUT_SECONDS:-15}
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD=${POSTGRES_PASSWORD:-edgelab} psql "host=127.0.0.1 port=6432 user=${POSTGRES_USER:-edgelab} dbname=${POSTGRES_DB:-edgelab}" -c "SELECT 1;" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${EDGELAB_PGBOUNCER_TIMESCALE_PORT:-6433}:6432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:${EDGELAB_REDIS_PORT:-6379}:6379"
    restart: unless-stopped

  minio:
    profiles:
      - benchmark
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edgelabminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-edgelabminio}
    ports:
      - "127.0.0.1:${EDGELAB_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${EDGELAB_MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped
    volumes:
      - minio-data:/data

  prometheus:
    profiles:
      - benchmark
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    depends_on:
      api:
        condition: service_started
      market-api:
        condition: service_started
    ports:
      - "127.0.0.1:${EDGELAB_PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./docker/observability/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true

  grafana:
    profiles:
      - benchmark
    image: grafana/grafana:11.1.4
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${EDGELAB_GRAFANA_ADMIN_USER:-edgelab}
      GF_SECURITY_ADMIN_PASSWORD: ${EDGELAB_GRAFANA_ADMIN_PASSWORD:-edgelab}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${EDGELAB_GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./docker/observability/grafana/provisioning/datasources/prometheus.yml
        target: /etc/grafana/provisioning/datasources/prometheus.yml
        read_only: true
      - type: bind
        source: ./docker/observability/grafana/provisioning/datasources/loki.yml
        target: /etc/grafana/provisioning/datasources/loki.yml
        read_only: true
      - type: bind
        source: ./docker/observability/grafana/provisioning/datasources/tempo.yml
        target: /etc/grafana/provisioning/datasources/tempo.yml
        read_only: true
      - type: bind
        source: ./docker/observability/grafana/provisioning/dashboards/dashboards.yml
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
        read_only: true
      - type: bind
        source: ./docker/observability/grafana/dashboards
        target: /etc/grafana/provisioning/dashboards/json
        read_only: true

  loki:
    profiles:
      - benchmark
    image: grafana/loki:3.1.1
    command:
      - -config.file=/etc/loki/config.yml
    ports:
      - "127.0.0.1:${EDGELAB_LOKI_PORT:-3100}:3100"
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./docker/observability/loki-config.yml
        target: /etc/loki/config.yml
        read_only: true
      - loki-data:/loki

  promtail:
    profiles:
      - benchmark
    image: grafana/promtail:3.1.1
    command:
      - -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./docker/observability/promtail.yml
        target: /etc/promtail/config.yml
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - promtail-data:/tmp/promtail

  tempo:
    profiles:
      - benchmark
    image: grafana/tempo:2.5.0
    command:
      - -config.file=/etc/tempo/config.yml
    ports:
      - "127.0.0.1:${EDGELAB_TEMPO_PORT:-3200}:3200"
      - "127.0.0.1:${EDGELAB_TEMPO_OTLP_HTTP_PORT:-4318}:4318"
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./docker/observability/tempo.yml
        target: /etc/tempo/config.yml
        read_only: true
      - tempo-data:/var/tempo

  postgres-exporter:
    profiles:
      - benchmark
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --collector.stat_statements
      - --collector.database
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-edgelab}:${POSTGRES_PASSWORD:-edgelab}@postgres:5432/${POSTGRES_DB:-edgelab}?sslmode=disable
    ports:
      - "127.0.0.1:${EDGELAB_POSTGRES_EXPORTER_PORT:-9187}:9187"
    restart: unless-stopped

  timescaledb-exporter:
    profiles:
      - benchmark
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    depends_on:
      timescaledb:
        condition: service_healthy
    command:
      - --collector.stat_statements
      - --collector.database
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-edgelab}:${POSTGRES_PASSWORD:-edgelab}@timescaledb:5432/${POSTGRES_DB:-edgelab}?sslmode=disable
    ports:
      - "127.0.0.1:${EDGELAB_TIMESCALE_EXPORTER_PORT:-9188}:9187"
    restart: unless-stopped

  api:
    <<: *backend-image
    depends_on:
      pgbouncer-postgres:
        condition: service_healthy
      pgbouncer-timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      EDGELAB_POSTGRES_HOST: ${EDGELAB_POSTGRES_HOST:-pgbouncer-postgres}
      EDGELAB_POSTGRES_CONNECT_PORT: ${EDGELAB_POSTGRES_CONNECT_PORT:-6432}
      EDGELAB_API_TOKEN: ${EDGELAB_API_TOKEN:-}
      EDGELAB_API_WORKERS: ${EDGELAB_API_WORKERS:-}
      EDGELAB_API_TIMEOUT_SECONDS: ${EDGELAB_API_TIMEOUT_SECONDS:-120}
      EDGELAB_API_GRACEFUL_TIMEOUT_SECONDS: ${EDGELAB_API_GRACEFUL_TIMEOUT_SECONDS:-30}
      EDGELAB_API_KEEPALIVE_SECONDS: ${EDGELAB_API_KEEPALIVE_SECONDS:-5}
      EDGELAB_RUN_MIGRATIONS: ${EDGELAB_RUN_MIGRATIONS:-1}
      EDGELAB_JWT_SECRET: ${EDGELAB_JWT_SECRET:-}
      EDGELAB_ENVIRONMENT: ${EDGELAB_ENVIRONMENT:-production}
      EDGELAB_SECRET_VAULT_KEYS: ${EDGELAB_SECRET_VAULT_KEYS:-}
      EDGELAB_SECRET_VAULT_ACTIVE_KEY_ID: ${EDGELAB_SECRET_VAULT_ACTIVE_KEY_ID:-}
      EDGELAB_BETA_MANUAL_ACCESS_ENABLED: ${EDGELAB_BETA_MANUAL_ACCESS_ENABLED:-0}
      EDGELAB_DEV_AUTH_BYPASS: ${EDGELAB_DEV_AUTH_BYPASS:-0}
      EDGELAB_BETA_SEATS_TOTAL: ${EDGELAB_BETA_SEATS_TOTAL:-500}
      EDGELAB_UI_REVISION: ${EDGELAB_UI_REVISION:-v2}
      EDGELAB_UI_KILL_SWITCH: ${EDGELAB_UI_KILL_SWITCH:-0}
      EDGELAB_UI_SHELL_V2: ${EDGELAB_UI_SHELL_V2:-1}
      EDGELAB_UI_JOURNAL_V2: ${EDGELAB_UI_JOURNAL_V2:-1}
      EDGELAB_UI_SETTINGS_V2: ${EDGELAB_UI_SETTINGS_V2:-1}
      EDGELAB_UI_CHART_V2: ${EDGELAB_UI_CHART_V2:-1}
      EDGELAB_UI_PUBLIC_V2: ${EDGELAB_UI_PUBLIC_V2:-1}
      EDGELAB_CACHE_MARKET_DATA: ${EDGELAB_CACHE_MARKET_DATA:-1}
      EDGELAB_MARKET_DATA_IMPORT_ENABLED: ${EDGELAB_MARKET_DATA_IMPORT_ENABLED:-1}
      EDGELAB_MARKET_DATA_DATABASE_URL: ${EDGELAB_MARKET_DATA_DATABASE_URL:-postgresql+psycopg://edgelab:edgelab@pgbouncer-timescaledb:6432/edgelab}
      EDGELAB_OBSERVABILITY_LOG_LEVEL: ${EDGELAB_OBSERVABILITY_LOG_LEVEL:-INFO}
      EDGELAB_OBSERVABILITY_JSON_LOGS: ${EDGELAB_OBSERVABILITY_JSON_LOGS:-1}
      EDGELAB_OTEL_ENVIRONMENT: ${EDGELAB_OTEL_ENVIRONMENT:-production}
      EDGELAB_REDIS_URL: ${EDGELAB_REDIS_URL:-redis://redis:6379/0}
      EDGELAB_OTEL_TRACE_SAMPLE_RATIO: ${EDGELAB_OTEL_TRACE_SAMPLE_RATIO:-1.0}
      EDGELAB_RATE_LIMIT_WINDOW_SECONDS: ${EDGELAB_RATE_LIMIT_WINDOW_SECONDS:-60}
      EDGELAB_DATASET_REFRESH_RATE_LIMIT: ${EDGELAB_DATASET_REFRESH_RATE_LIMIT:-6}
      EDGELAB_MARKET_DATA_META_RATE_LIMIT: ${EDGELAB_MARKET_DATA_META_RATE_LIMIT:-240}
      EDGELAB_MARKET_DATA_BARS_RATE_LIMIT: ${EDGELAB_MARKET_DATA_BARS_RATE_LIMIT:-240}
      EDGELAB_DATASET_AUTO_DISCOVERY_ENABLED: ${EDGELAB_DATASET_AUTO_DISCOVERY_ENABLED:-0}
      EDGELAB_DATASETS_ROOT: /datasets
      EDGELAB_PUBLIC_ORIGIN: ${EDGELAB_PUBLIC_ORIGIN:-}
      EDGELAB_MAX_APP_DATA_ROWS: ${EDGELAB_MAX_APP_DATA_ROWS:-100000}
      EDGELAB_MAX_REQUEST_BODY_BYTES: ${EDGELAB_MAX_REQUEST_BODY_BYTES:-26214400}
      EDGELAB_EXTERNAL_AI_BASE_URL: ${EDGELAB_EXTERNAL_AI_BASE_URL:-}
      EDGELAB_EXTERNAL_AI_MODEL: ${EDGELAB_EXTERNAL_AI_MODEL:-}
      EDGELAB_EXTERNAL_AI_TIMEOUT_SECONDS: ${EDGELAB_EXTERNAL_AI_TIMEOUT_SECONDS:-30}
      EDGELAB_QUANT_CAPTURE_ROOT: ${EDGELAB_QUANT_CAPTURE_ROOT:-/var/lib/edgelab/quant-captures}
      GOOGLE_CLIENT_SECRETS_FILE: ${GOOGLE_CLIENT_SECRETS_FILE:-/opt/edgelab/deployment/google-oauth-client.json}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: edgelab-api
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-edgelab}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    volumes:
      - api-data:/var/lib/edgelab
      - type: bind
        source: ${EDGELAB_DATASETS_ROOT:-./datasets}
        target: /datasets
        read_only: true
      - type: bind
        source: ./deployment
        target: /opt/edgelab/deployment
        read_only: true

  market-api:
    <<: *backend-image
    depends_on:
      pgbouncer-postgres:
        condition: service_healthy
      pgbouncer-timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      EDGELAB_POSTGRES_HOST: ${EDGELAB_POSTGRES_HOST:-pgbouncer-postgres}
      EDGELAB_POSTGRES_CONNECT_PORT: ${EDGELAB_POSTGRES_CONNECT_PORT:-6432}
      EDGELAB_API_TOKEN: ${EDGELAB_API_TOKEN:-}
      EDGELAB_API_WORKERS: ${EDGELAB_API_WORKERS:-}
      EDGELAB_API_TIMEOUT_SECONDS: ${EDGELAB_API_TIMEOUT_SECONDS:-120}
      EDGELAB_API_GRACEFUL_TIMEOUT_SECONDS: ${EDGELAB_API_GRACEFUL_TIMEOUT_SECONDS:-30}
      EDGELAB_API_KEEPALIVE_SECONDS: ${EDGELAB_API_KEEPALIVE_SECONDS:-5}
      EDGELAB_RUN_MIGRATIONS: 0
      EDGELAB_JWT_SECRET: ${EDGELAB_JWT_SECRET:-}
      EDGELAB_ENVIRONMENT: ${EDGELAB_ENVIRONMENT:-production}
      EDGELAB_SECRET_VAULT_KEYS: ${EDGELAB_SECRET_VAULT_KEYS:-}
      EDGELAB_SECRET_VAULT_ACTIVE_KEY_ID: ${EDGELAB_SECRET_VAULT_ACTIVE_KEY_ID:-}
      EDGELAB_BETA_MANUAL_ACCESS_ENABLED: ${EDGELAB_BETA_MANUAL_ACCESS_ENABLED:-0}
      EDGELAB_DEV_AUTH_BYPASS: ${EDGELAB_DEV_AUTH_BYPASS:-0}
      EDGELAB_BETA_SEATS_TOTAL: ${EDGELAB_BETA_SEATS_TOTAL:-500}
      EDGELAB_CACHE_MARKET_DATA: ${EDGELAB_CACHE_MARKET_DATA:-1}
      EDGELAB_MARKET_DATA_IMPORT_ENABLED: ${EDGELAB_MARKET_DATA_IMPORT_ENABLED:-1}
      EDGELAB_MARKET_DATA_DATABASE_URL: ${EDGELAB_MARKET_DATA_DATABASE_URL:-postgresql+psycopg://edgelab:edgelab@pgbouncer-timescaledb:6432/edgelab}
      EDGELAB_OBSERVABILITY_LOG_LEVEL: ${EDGELAB_OBSERVABILITY_LOG_LEVEL:-INFO}
      EDGELAB_OBSERVABILITY_JSON_LOGS: ${EDGELAB_OBSERVABILITY_JSON_LOGS:-1}
      EDGELAB_OTEL_ENVIRONMENT: ${EDGELAB_OTEL_ENVIRONMENT:-production}
      EDGELAB_REDIS_URL: ${EDGELAB_REDIS_URL:-redis://redis:6379/0}
      EDGELAB_OTEL_TRACE_SAMPLE_RATIO: ${EDGELAB_OTEL_TRACE_SAMPLE_RATIO:-1.0}
      EDGELAB_RATE_LIMIT_WINDOW_SECONDS: ${EDGELAB_RATE_LIMIT_WINDOW_SECONDS:-60}
      EDGELAB_DATASET_REFRESH_RATE_LIMIT: ${EDGELAB_DATASET_REFRESH_RATE_LIMIT:-6}
      EDGELAB_MARKET_DATA_META_RATE_LIMIT: ${EDGELAB_MARKET_DATA_META_RATE_LIMIT:-240}
      EDGELAB_MARKET_DATA_BARS_RATE_LIMIT: ${EDGELAB_MARKET_DATA_BARS_RATE_LIMIT:-240}
      EDGELAB_DATASET_AUTO_DISCOVERY_ENABLED: ${EDGELAB_DATASET_AUTO_DISCOVERY_ENABLED:-0}
      EDGELAB_DATASETS_ROOT: /datasets
      EDGELAB_PUBLIC_ORIGIN: ${EDGELAB_PUBLIC_ORIGIN:-}
      EDGELAB_MAX_APP_DATA_ROWS: ${EDGELAB_MAX_APP_DATA_ROWS:-100000}
      EDGELAB_MAX_REQUEST_BODY_BYTES: ${EDGELAB_MAX_REQUEST_BODY_BYTES:-26214400}
      GOOGLE_CLIENT_SECRETS_FILE: ${GOOGLE_CLIENT_SECRETS_FILE:-/opt/edgelab/deployment/google-oauth-client.json}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: edgelab-market-api
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-edgelab}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    volumes:
      - api-data:/var/lib/edgelab
      - type: bind
        source: ${EDGELAB_DATASETS_ROOT:-./datasets}
        target: /datasets
        read_only: true
      - type: bind
        source: ./deployment
        target: /opt/edgelab/deployment
        read_only: true

  data-populator:
    <<: *backend-image
    command: ["python", "-m", "app.data_populator"]
    depends_on:
      pgbouncer-postgres:
        condition: service_healthy
      pgbouncer-timescaledb:
        condition: service_healthy
    user: "${EDGELAB_DATA_POPULATOR_USER:-0:0}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edgelab}
      POSTGRES_USER: ${POSTGRES_USER:-edgelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgelab}
      EDGELAB_POSTGRES_HOST: ${EDGELAB_POSTGRES_HOST:-pgbouncer-postgres}
      EDGELAB_POSTGRES_CONNECT_PORT: ${EDGELAB_POSTGRES_CONNECT_PORT:-6432}
      EDGELAB_DATASETS_ROOT: /datasets
      EDGELAB_MARKET_DATA_IMPORT_ENABLED: ${EDGELAB_MARKET_DATA_IMPORT_ENABLED:-1}
      EDGELAB_MARKET_DATA_DATABASE_URL: ${EDGELAB_MARKET_DATA_DATABASE_URL:-postgresql+psycopg://edgelab:edgelab@pgbouncer-timescaledb:6432/edgelab}
      EDGELAB_OBSERVABILITY_LOG_LEVEL: ${EDGELAB_OBSERVABILITY_LOG_LEVEL:-INFO}
      EDGELAB_OBSERVABILITY_JSON_LOGS: ${EDGELAB_OBSERVABILITY_JSON_LOGS:-1}
      EDGELAB_OTEL_ENVIRONMENT: ${EDGELAB_OTEL_ENVIRONMENT:-production}
      EDGELAB_OTEL_TRACE_SAMPLE_RATIO: ${EDGELAB_OTEL_TRACE_SAMPLE_RATIO:-1.0}
      EDGELAB_DATA_POPULATOR_CRYPTO_SYMBOLS: ${EDGELAB_DATA_POPULATOR_CRYPTO_SYMBOLS:-BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,MATICUSDT,LTCUSDT,BCHUSDT,UNIUSDT,ATOMUSDT,ETCUSDT,APTUSDT,NEARUSDT,FILUSDT,ARBUSDT,OPUSDT}
      EDGELAB_DATA_POPULATOR_CRYPTO_START_DATE: ${EDGELAB_DATA_POPULATOR_CRYPTO_START_DATE:-2017-08-17}
      EDGELAB_DATA_POPULATOR_BACKFILL_MODE: ${EDGELAB_DATA_POPULATOR_BACKFILL_MODE:-max}
      EDGELAB_DATA_POPULATOR_DERIVED_TIMEFRAMES: ${EDGELAB_DATA_POPULATOR_DERIVED_TIMEFRAMES:-M5,M15,M30,H1,H4,Daily}
      EDGELAB_DATA_POPULATOR_FOREX_SYMBOLS: ${EDGELAB_DATA_POPULATOR_FOREX_SYMBOLS:-EUR/USD,GBP/USD,USD/JPY,USD/CHF,AUD/USD,USD/CAD,NZD/USD,EUR/JPY,GBP/JPY,AUD/JPY,CAD/JPY,CHF/JPY,NZD/JPY,EUR/GBP,EUR/CHF,EUR/AUD,EUR/CAD,GBP/CHF,GBP/AUD,AUD/NZD,XAU/USD,XAG/USD,E_Brent,E_Light,E_SandP-500,E_NQ-100,E_D&J-Ind,E_DAAX}
      EDGELAB_DATA_POPULATOR_FOREX_START_DATE: ${EDGELAB_DATA_POPULATOR_FOREX_START_DATE:-2003-01-01}
      EDGELAB_DATA_POPULATOR_INTERVAL_SECONDS: ${EDGELAB_DATA_POPULATOR_INTERVAL_SECONDS:-3600}
      EDGELAB_DATA_POPULATOR_LOOKBACK_DAYS: ${EDGELAB_DATA_POPULATOR_LOOKBACK_DAYS:-30}
      EDGELAB_DATA_POPULATOR_REQUEST_TIMEOUT_SECONDS: ${EDGELAB_DATA_POPULATOR_REQUEST_TIMEOUT_SECONDS:-20}
      EDGELAB_DATA_POPULATOR_BACKFILL_WRITE_BATCH_CANDLES: ${EDGELAB_DATA_POPULATOR_BACKFILL_WRITE_BATCH_CANDLES:-250000}
      EDGELAB_DATA_POPULATOR_BINANCE_ARCHIVE_WORKERS: ${EDGELAB_DATA_POPULATOR_BINANCE_ARCHIVE_WORKERS:-2}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: edgelab-data-populator
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-edgelab}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${EDGELAB_DATASETS_ROOT:-./datasets}
        target: /datasets

  analytics-worker:
    <<: *backend-image
    command: ["python", "-m", "app.analytics_worker"]
    depends_on:
      pgbouncer-postgres:
        condition: service_healthy
    environment:
      EDGELAB_POSTGRES_HOST: ${EDGELAB_POSTGRES_HOST:-pgbouncer-postgres}
      EDGELAB_POSTGRES_CONNECT_PORT: ${EDGELAB_POSTGRES_CONNECT_PORT:-6432}
      EDGELAB_ANALYTICS_INTERVAL_SECONDS: ${EDGELAB_ANALYTICS_INTERVAL_SECONDS:-60}
      EDGELAB_JWT_SECRET: ${EDGELAB_JWT_SECRET:-}
      EDGELAB_OBSERVABILITY_LOG_LEVEL: ${EDGELAB_OBSERVABILITY_LOG_LEVEL:-INFO}
      EDGELAB_OBSERVABILITY_JSON_LOGS: ${EDGELAB_OBSERVABILITY_JSON_LOGS:-1}
      EDGELAB_OTEL_ENVIRONMENT: ${EDGELAB_OTEL_ENVIRONMENT:-production}
      EDGELAB_OTEL_TRACE_SAMPLE_RATIO: ${EDGELAB_OTEL_TRACE_SAMPLE_RATIO:-1.0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: edgelab-analytics-worker
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-edgelab}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_API_BEARER_TOKEN: ${VITE_API_BEARER_TOKEN:-}
        VITE_DEPLOYMENT_MODE: ${VITE_DEPLOYMENT_MODE:-beta}
        VITE_BETA_SEATS_TOTAL: ${VITE_BETA_SEATS_TOTAL:-500}
        VITE_BETA_SEATS_TAKEN: ${VITE_BETA_SEATS_TAKEN:-0}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    depends_on:
      api:
        condition: service_healthy
      market-api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

  legacy-api:
    profiles:
      - legacy-node-api
    build:
      context: .
      dockerfile: backend/Dockerfile.node
    environment:
      PORT: 3001
      LEGACY_API_MAX_BODY_BYTES: ${LEGACY_API_MAX_BODY_BYTES:-10485760}
      LEGACY_CORS_ORIGINS: ${LEGACY_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - "${LEGACY_API_PORT:-3001}:3001"
    restart: unless-stopped
    volumes:
      - legacy-api-data:/app/backend/data
      - legacy-uploads:/app/backend/uploads

  benchmark-k6:
    profiles:
      - benchmark
    image: grafana/k6:0.49.0
    depends_on:
      frontend:
        condition: service_started
    entrypoint: ["k6"]
    working_dir: /benchmark
    volumes:
      - ./benchmark:/benchmark:ro

volumes:
  api-data:
  postgres-data:
  timescaledb-data:
  minio-data:
  loki-data:
  legacy-api-data:
  legacy-uploads:
  promtail-data:
  tempo-data:
