# This is an HTTP allowlist, not merely a read-only socket mount.
# Reachable only by Alloy on the private docker-logs network; no host port.
global
    maxconn 128
    nbthread 1

defaults
    mode http
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout http-request 5s

frontend docker_logs
    bind :2375
    acl is_get method GET
    acl is_head method HEAD
    acl ping path_reg ^(/v[0-9]+[.][0-9]+)?/_ping$
    acl version path_reg ^(/v[0-9]+[.][0-9]+)?/version$
    acl discovery path_reg ^/v[0-9]+[.][0-9]+/(containers/json|networks)$
    acl logs path_reg ^/v[0-9]+[.][0-9]+/containers/[0-9a-f]{64}/logs$
    acl inspect path_reg ^/v[0-9]+[.][0-9]+/containers/[0-9a-f]{64}/json$
    http-request deny deny_status 403 unless is_get or is_head ping
    # Alloy 1.20.1 reads only Config.Tty and State.Running/FinishedAt from
    # inspect. Compose app services are non-TTY; discovery removes stopped
    # containers. Never forward inspect: its Config.Env contains secrets.
    http-request return status 200 content-type application/json string '{"Config":{"Tty":false},"State":{"Running":true,"FinishedAt":"0001-01-01T00:00:00Z"}}' if is_get inspect
    http-request deny deny_status 403 unless ping or version or discovery or logs
    # Force project scoping even if a client forgets its discovery filter.
    # Compose restricts project names to letters, digits, underscores, hyphens.
    http-request set-query filters=%%7B%%22label%%22:%%5B%%22com.docker.compose.project=%[env(EDGELAB_LOG_COMPOSE_PROJECT)]%%22%%5D%%7D if discovery
    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
