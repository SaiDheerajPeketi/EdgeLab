global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: edgelab-api
    metrics_path: /api/observability/metrics
    static_configs:
      - targets:
          - api:8000
          - market-api:8000

  - job_name: edgelab-postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
          - timescaledb-exporter:9187
