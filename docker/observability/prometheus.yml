global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Discover every container replica; each endpoint aggregates its own workers.
  - job_name: edgelab-api
    metrics_path: /api/observability/metrics
    sample_limit: 20000
    dns_sd_configs:
      - names: [api, market-api]
        type: A
        port: 8000
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: edgelab-postgres
    sample_limit: 20000
    # The efficient overlay intentionally omits its Timescale exporter.
    dns_sd_configs:
      - names: [postgres-exporter, timescaledb-exporter]
        type: A
        port: 9187
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: store

  - job_name: edgelab-observability
    sample_limit: 20000
    static_configs:
      - targets: [prometheus:9090, alloy:12345, loki:3100, tempo:3200]
