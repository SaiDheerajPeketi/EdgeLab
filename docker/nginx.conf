# Socket clients share a budget; forwarded address headers are not trusted keys.
limit_req_zone $binary_remote_addr zone=google_exchange:10m rate=10r/m;

# Keep Retry-After at server scope so error locations inherit every security header.
map $limit_req_status $google_exchange_retry_after {
  default "";
  REJECTED "6";
}

upstream edgelab_api {
  server api:8000;
  keepalive 32;
}

upstream edgelab_market_api {
  server market-api:8000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;
  sendfile on;
  tcp_nopush on;

  open_file_cache max=1000 inactive=30s;
  open_file_cache_valid 60s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  gzip on;
  gzip_static on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  add_header Retry-After $google_exchange_retry_after always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://localhost:* http://127.0.0.1:* https://data-api.binance.vision https://api.binance.com https://freeserv.dukascopy.com wss://data-stream.binance.vision ws://localhost:* ws://127.0.0.1:*;" always;

  location = /nginx-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /api/live/angelone/stream {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_pass http://edgelab_market_api/api/live/angelone/stream;
  }

  location = /api/datasets/stream {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_pass http://edgelab_market_api/api/datasets/stream;
  }

  # Prometheus reaches this endpoint over the private Compose network.
  location = /api/observability/metrics {
    return 404;
  }

  location = /api/market-data/meta {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://edgelab_market_api/api/market-data/meta;
  }

  location /api/market-data/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://edgelab_market_api/api/market-data/;
  }

  location = /api/datasets {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://edgelab_market_api/api/datasets;
  }

  location /api/datasets/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://edgelab_market_api/api/datasets/;
  }

  location /api/live/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://edgelab_market_api/api/live/;
  }

  location = /api/auth/google/exchange {
    limit_req zone=google_exchange burst=3 nodelay;
    limit_req_status 429;
    error_page 429 = @google_exchange_limited;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://edgelab_api/api/auth/google/exchange;
  }

  location @google_exchange_limited {
    internal;
    default_type application/json;
    return 429 '{"detail":"Too many sign-in attempts. Try again shortly."}\n';
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://edgelab_api/api/;
  }

  # Source metadata must stay fresh, and missing offers must not fall back to the SPA.
  location ^~ /source/ {
    expires -1;
    try_files $uri $uri/ =404;
  }

  location /assets/ {
    access_log off;
    expires 1y;
    try_files $uri =404;
  }

  location = /index.html {
    expires -1;
    try_files /index.html =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
