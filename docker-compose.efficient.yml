# New-install option: one indexed PostgreSQL store, same workers and history.
# Requires Docker Compose >= 2.24.4 (!override).
# Migrate existing candle data before switching an existing split deployment.
services:
  timescaledb:
    profiles: [timescale]
  pgbouncer-timescaledb:
    profiles: [timescale]
  timescaledb-exporter:
    profiles: [timescale-observability]
  pgbouncer-postgres:
    environment:
      # Preserve the combined server-connection budget of the two default poolers.
      EDGELAB_PGBOUNCER_DEFAULT_POOL_SIZE: ${EDGELAB_EFFICIENT_PGBOUNCER_POOL_SIZE:-50}
      EDGELAB_PGBOUNCER_RESERVE_POOL_SIZE: ${EDGELAB_EFFICIENT_PGBOUNCER_RESERVE_POOL_SIZE:-10}
  api:
    depends_on: !override
      pgbouncer-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EDGELAB_MARKET_DATA_POSTGRES_HOST: pgbouncer-postgres
      EDGELAB_MARKET_DATA_IMPORT_ENABLED: 1
  market-api:
    depends_on: !override
      api:
        condition: service_healthy
      pgbouncer-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EDGELAB_MARKET_DATA_POSTGRES_HOST: pgbouncer-postgres
      EDGELAB_MARKET_DATA_IMPORT_ENABLED: 1
  data-populator:
    depends_on: !override
      api:
        condition: service_healthy
      pgbouncer-postgres:
        condition: service_healthy
    environment:
      EDGELAB_MARKET_DATA_POSTGRES_HOST: pgbouncer-postgres
      EDGELAB_MARKET_DATA_IMPORT_ENABLED: 1
