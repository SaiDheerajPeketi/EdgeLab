name: UI regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CI: "1"
      EDGELAB_BUILD_SHA: ${{ github.sha }}
      EDGELAB_E2E_PYTHON: python
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          cache: pip
          cache-dependency-path: backend/requirements.txt
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt

      - name: Install pinned Chromium
        run: npx playwright install chromium

      - name: Build frontend
        run: npm run check:ui-release && npm run build

      - name: Verify reviewed Pine engine semantics and integrity
        run: node --test backend/tests/pine-engine-integrity54.test.js backend/tests/pine-realtime54.test.js backend/tests/pine-object-copy55.test.js backend/tests/pine-object-history56.test.js backend/tests/pine-realtime57.test.js backend/tests/pine-live58.test.js backend/tests/pine-live-feed58.test.js backend/tests/pine-strategy63.test.js backend/tests/pine-strategy64.test.js backend/tests/pine-chart-notices.test.js backend/tests/chart-runtime-ownership.test.js backend/tests/pane-market-ownership.test.js backend/tests/live-source-health-ownership.test.js

      - name: Validate UI surface inventory
        run: npm run check:ui-inventory && npm run test:ui-inventory && npm run check:ui-certification && npm run test:ui-certification

      - name: Run focused accessibility certification
        run: npm run test:ui-certification:runtime && npm run check:ui-route-accessibility && npm run test:ui-route-accessibility

      - name: Enforce UI size and motion budgets
        run: npm run check:ui-performance && npm run check:ui-motion

      - name: Run deterministic UI gate
        run: npm run test:ui

      - name: Run production pricing and checkout gate
        run: npx playwright test --config=e2e/public-checkout48.config.ts

      - name: Run native Pine candle layering gate
        run: npx playwright test --config=e2e/pine-layering.config.ts

      - name: Run native Pine OHLC bar plotting gate
        run: npx playwright test --config=e2e/pine-bars53.config.ts

      - name: Run native Pine object copying gate
        run: npx playwright test --config=e2e/pine-copy55.config.ts

      - name: Run native Pine object history gate
        run: npx playwright test --config=e2e/pine-history56.config.ts

      - name: Run persistent native Pine Live chart gate
        run: npx playwright test --config=e2e/pine-live58.config.ts

      - name: Run native Pine context ownership gate
        run: npx playwright test --config=e2e/pine-context59.config.ts

      - name: Run native study responsive geometry gate
        run: EDGELAB_GEOMETRY51_PHASE=verified npx playwright test --config=e2e/pine-study-geometry51.config.ts

      - name: Run continuous landing demo and motion gate
        run: npx playwright test --config=e2e/landing-continuity52.config.ts

      - name: Verify fixed OHLC software perspective geometry
        run: node --test backend/tests/market-sculpture-projection.test.js

      - name: Run dimensional landing fallback gate
        run: npx playwright test --config=e2e/landing-sculpture60.config.ts

      - name: Verify expanded Pine catalog calculations and preservation
        run: node --test backend/tests/pine-catalog62.test.js

      - name: Run expanded Pine catalog product gate
        run: npx playwright test --config=e2e/pine-catalog62.config.ts

      - name: Run trader strategy settings product gate
        run: npx playwright test --config=e2e/pine-strategy64.config.ts

      - name: Verify replay session ownership and write sequencing
        run: node --test backend/tests/replay-session-ownership.test.js

      - name: Run replay session continuity gate
        run: npx playwright test --config=e2e/replay-session61.config.ts

      - name: Publish low-power metrics summary
        if: always()
        shell: bash
        run: |
          metrics_path="$(find .artifacts/ui-results -name low-power-performance.json -print -quit)"
          if [[ -n "$metrics_path" ]]; then
            {
              echo "## Low-power chart performance"
              echo '```json'
              cat "$metrics_path"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Low-power chart performance\n\nNo metrics file was produced.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

          page_metrics_path="$(find .artifacts/ui-results -name page-performance.json -print -quit)"
          if [[ -n "$page_metrics_path" ]]; then
            {
              echo "## Page performance"
              echo '```json'
              cat "$page_metrics_path"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Page performance\n\nNo metrics file was produced.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: ui-regression-artifacts
          path: .artifacts/
          retention-days: 14
